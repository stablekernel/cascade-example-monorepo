ci:
  config:
    schema_version: 1
    trunk_branch: main
    environments:
      - dev
      - staging
      - prod
    cli_version: v1.1.3-rc.2
    cli_version_sha: 0ded3b4a8e8f5b895e7610465a671e861abfe70d
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    shared_paths:
      - libs/common/**
    components:
      api:
        path: services/api
        tag_grammar:
          prefix: api-
        builds:
          - name: api
            workflow: .github/workflows/build-api.yaml
            triggers:
              - services/api/**
        deploys:
          - name: api
            workflow: .github/workflows/deploy-api.yaml
            triggers:
              - services/api/**
      web:
        path: apps/web
        tag_grammar:
          prefix: web-
        builds:
          - name: web
            workflow: .github/workflows/build-web.yaml
            triggers:
              - apps/web/**
        deploys:
          - name: web
            workflow: .github/workflows/deploy-web.yaml
            triggers:
              - apps/web/**
  state:
    components:
      api:
        dev:
          sha: 44e9e6bce804c873090085763caa7f065b6fee64
          version: api-0.1.0-rc.0
          committed_at: "2026-11-23T06:30:37Z"
          committed_by: joshua-temple
          deploys:
            api:
              sha: 44e9e6bce804c873090085763caa7f065b6fee64
              deployed_at: "2026-11-23T06:30:37Z"
              deployed_by: joshua-temple
  latest_release:
