ci:
  config:
    schema_version: 1
    trunk_branch: main
    environments:
      - dev
      - staging
      - prod
    cli_version: v1.1.3-rc.2
    cli_version_sha: 0ded3b4a8e8f5b895e7610465a671e861abfe70d
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    shared_paths:
      - libs/common/**
    components:
      api:
        path: services/api
        tag_grammar:
          prefix: api-
        builds:
          - name: api
            workflow: .github/workflows/build-api.yaml
            triggers:
              - services/api/**
        deploys:
          - name: api
            workflow: .github/workflows/deploy-api.yaml
            triggers:
              - services/api/**
      web:
        path: apps/web
        tag_grammar:
          prefix: web-
        builds:
          - name: web
            workflow: .github/workflows/build-web.yaml
            triggers:
              - apps/web/**
        deploys:
          - name: web
            workflow: .github/workflows/deploy-web.yaml
            triggers:
              - apps/web/**
  state:
    components:
      api:
        dev:
          sha: c4371ab704b6d5fbc5ddd0f4b54c7b1939d1457c
          version: api-0.1.0-rc.0
          committed_at: "2026-11-22T08:50:29Z"
          committed_by: joshua-temple
          deploys:
            api:
              sha: c4371ab704b6d5fbc5ddd0f4b54c7b1939d1457c
              deployed_at: "2026-11-22T08:50:29Z"
              deployed_by: joshua-temple
  latest_release:
