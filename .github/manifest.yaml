ci:
  config:
    schema_version: 1
    trunk_branch: main
    environments:
      - dev
      - staging
      - prod
    cli_version: v1.1.2-rc.0
    cli_version_sha: 3742e04377b952a263bb48a0a0bb5905c253d603
    state_token: ${{ secrets.CASCADE_STATE_TOKEN }}
    manifest_file: .github/manifest.yaml
    manifest_key: ci
    shared_paths:
      - libs/common/**
    components:
      api:
        path: services/api
        tag_grammar:
          prefix: api-
        builds:
          - name: api
            workflow: .github/workflows/build-api.yaml
            triggers:
              - services/api/**
        deploys:
          - name: api
            workflow: .github/workflows/deploy-api.yaml
            triggers:
              - services/api/**
      web:
        path: apps/web
        tag_grammar:
          prefix: web-
        builds:
          - name: web
            workflow: .github/workflows/build-web.yaml
            triggers:
              - apps/web/**
        deploys:
          - name: web
            workflow: .github/workflows/deploy-web.yaml
            triggers:
              - apps/web/**
  state:
    components:
      api:
        dev:
          sha: 1e97e2e16fde24270aa62b39081cc52a222735e4
          version: api-0.1.0-rc.0
          committed_at: "2026-10-12T06:52:05Z"
          committed_by: joshua-temple
          deploys:
            api:
              sha: 1e97e2e16fde24270aa62b39081cc52a222735e4
              deployed_at: "2026-10-12T06:52:05Z"
              deployed_by: joshua-temple
  latest_release:
    components:
      api:
        version: api-0.3.0
        sha: e82833b95b6992d8c0b454f4b7c06252fcad7287
        released_on: "2026-10-05T07:18:19Z"
